<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{
  --bg:#F5F7FA; --card:#fff; --border:#E8ECF0; --border2:#D1D9E0;
  --green:#1DB954; --greenD:#17a349; --greenL:#E8F8EE;
  --blue:#3B82F6; --blueL:#EFF6FF; --purple:#8B5CF6; --purpleL:#F5F3FF;
  --amber:#F59E0B; --amberL:#FFFBEB; --red:#EF4444; --redL:#FEF2F2;
  --teal:#0EA5E9; --tealL:#F0F9FF;
  --text:#111827; --text2:#374151; --text3:#6B7280; --text4:#9CA3AF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text);background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,185,84,.1)}
textarea{resize:vertical;min-height:56px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:var(--green)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.app{min-height:100vh;display:flex}
.sidebar{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;padding:14px}
.brand{padding:4px 6px 14px;border-bottom:1px solid var(--border);margin-bottom:10px}
.brand .logo{font-weight:800;font-size:18px;color:var(--green);letter-spacing:-.5px}
.brand .sub{font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.userbox{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--bg);border-radius:9px;margin-bottom:10px}
.userbox .em{font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.userbox .rl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.navlink{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:var(--text3);font-size:13px;font-weight:500;text-align:left;width:100%;margin-bottom:2px}
.navlink:hover{background:var(--bg)}
.navlink.on{background:var(--greenL);color:var(--green);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:50}
.content{padding:26px;overflow-y:auto;flex:1}

.avatar{border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-head h2{font-size:20px;font-weight:700}
.page-head p{font-size:13px;color:var(--text3);margin-top:2px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px}
.card+.card,.stack>*+*{margin-top:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}

.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;text-align:left}
.stat .ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:18px}
.stat .v{font-size:26px;font-weight:700}
.stat .l{font-size:11px;color:var(--text4);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}

.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;background:var(--green);color:#fff;box-shadow:0 1px 3px rgba(29,185,84,.3)}
.btn:hover{background:var(--greenD)}
.btn.sec{background:#fff;color:var(--text2);border:1.5px solid var(--border2);box-shadow:none}
.btn.danger{background:var(--redL);color:var(--red);border:1.5px solid rgba(239,68,68,.3);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 11px;font-size:11px;font-weight:600}
.tag{border-radius:6px;padding:2px 9px;font-size:11px;font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--text2)}
.field .req{color:var(--red);margin-left:2px}
.hint{font-size:11px;color:var(--text4)}

table.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.5px;padding:11px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#FAFBFC}

.rate{width:38px;height:38px;border-radius:9px;border:2px solid var(--border);background:#fff;color:var(--text3);font-weight:700;font-size:14px}
.beh{padding:7px 13px;border-radius:8px;border:2px solid var(--border);background:#fff;color:var(--text3);font-size:12px;font-weight:600}
.bar{height:7px;background:var(--border);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;transition:width .4s}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px}
.modal-b{padding:22px}
.toast{position:fixed;bottom:22px;right:22px;z-index:2000;color:#fff;border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.18)}
.empty{text-align:center;padding:46px 20px;color:var(--text4)}
.empty .t{font-weight:600;font-size:15px;color:var(--text2);margin-bottom:6px}
.spin{width:18px;height:18px;border:2px solid var(--green);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text3)}
.muted{color:var(--text3)}
.steps{display:flex;align-items:center;max-width:420px;margin-bottom:24px}
.steps .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--border);color:var(--text4)}
.steps .dot.on{background:var(--green);color:#fff}
.steps .ln{flex:1;height:2px;background:var(--border);margin:0 6px}
.steps .ln.on{background:var(--green)}
.kpi-row{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}
.flex{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.wrap{flex-wrap:wrap}
</style>
